<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Default" />

<f:section name="google-map">
    <f:if condition="{configuration.facets}">
        <f:if condition="{configuration.header}">
            <h{configuration.header_layout -> f:or(alternative: 2)}>{configuration.header}</h{configuration.header_layout -> f:or(alternative: 2)}>
        </f:if>
        <form class="gmap-filter" data-gmap-id="{mapId}" onsubmit="return false">
            <f:render section="filter" arguments="{mapId: mapId, type: 'institution_type', label: 'Art der Einrichtung', prefix: 'institution', options: configuration.facets.institution_types}" />
            <f:render section="filter" arguments="{mapId: mapId, type: 'person_function', label: 'Funktion der Person', prefix: 'person', options: configuration.facets.functions}" />
            <f:render section="filter" arguments="{mapId: mapId, type: 'category', label: 'Rubrik', prefix: 'category', options: configuration.facets.categories}" />
            <f:render section="filter" arguments="{mapId: mapId, type: 'event_type', label: 'Veranstaltungsart', prefix: 'event', options: configuration.facets.event_types}" />
        </form>
    </f:if>

    <div data-gmap-id="{mapId}" data-gmap-config="{clientConfiguration}" class="gmap-canvas-container {configuration.cssClass}">
        <f:if condition="{requestUri} || {streamUri}">
            <div class="overlay">
                <div class="spinner" aria-label="Karten-Marker werden geladen …" role="status" aria-busy="true"></div>
            </div>
        </f:if>
        <div id="gmap-canvas-{mapId}" class="map" style="{configuration.style}"></div>
    </div>
</f:section>

<f:section name="filter">
    <f:if condition="{options -> f:count()} > 1">
        <label for="{mapId}-{type}">{label}</label>
        <select id="{mapId}-{type}" class="map-filter" data-gmap-id="{mapId}" data-type="{type}">
            <option value="">{label}</option>
            <f:for each="{options}" key="id" as="option">
                <option value="{prefix}-{id}">{option}</option>
            </f:for>
        </select>
    </f:if>
</f:section>
</html>
